# alembic.ini -- Alembic migration config (PostgreSQL ONLY)
#
# NOTE: this file is intentionally ASCII-only (English comments).
# Reason: Alembic reads alembic.ini with encoding="locale" (see alembic/util/compat.py).
# On a Chinese Windows the locale encoding is GBK, so any UTF-8 non-ASCII byte here makes
# every `alembic` command fail with UnicodeDecodeError before it even starts.
# The full Chinese rationale lives in app/alembic/env.py and docs/agent_refactor_plan.md.
#
# Why Alembic covers PG only:
#   MySQL tables (user / generation_task) still use Base.metadata.create_all(), which is
#   already verified. The PG side needs CREATE EXTENSION vector and (phase 2) HNSW indexes
#   that create_all() cannot express, so it needs a real migration tool.
#
# Commands (run from backend-uv-fastapi):
#   uv run alembic upgrade head                       # apply all
#   uv run alembic current                            # show current revision
#   uv run alembic revision --autogenerate -m "msg"   # new migration from models
#   uv run alembic downgrade -1                       # roll back one step

[alembic]
script_location = app/alembic
# Make the `app` package importable (env.py imports app.models.agent / app.core.pg_db).
prepend_sys_path = .

# NOTE: the database URL is deliberately NOT set here.
# app/alembic/env.py loads it from .env so the password never lands in version control.
# Do not add `sqlalchemy.url` below.

# Timestamped migration filenames so the versions/ folder sorts chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
